name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "site/package-lock.json"

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro static site & sitemap
        working-directory: site
        run: npm run build

      - name: Verify critical static build outputs
        working-directory: site
        run: |
          test -f dist/index.html
          test -f dist/sitemap-index.xml
          test -f dist/sitemap-0.xml
          test -f dist/robots.txt
          echo "Static build and sitemap verification passed."

      - name: Deploy to Cloudflare Pages (if credentials configured)
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'vramcalc' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler pages deploy dist --project-name="$CLOUDFLARE_PROJECT_NAME"
          else
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping direct Wrangler deploy (relying on Cloudflare Pages Git integration)."
          fi
